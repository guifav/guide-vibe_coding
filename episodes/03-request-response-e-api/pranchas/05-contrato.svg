ont-weight="600" fill="#FFFFFF" text-anchor="start">{ "nome": ..., "preco": ... }</text><text x="1060" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#A0A0A0" text-anchor="start">front procura título, não acha</text><line x1="1064" y1="690" x2="1100" y2="726" stroke="#F87171" stroke-width="4"/><line x1="1064" y1="726" x2="1100" y2="690" stroke="#F87171" stroke-width="4"/><text x="1130" y="718" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">tela em branco</text><text x="960.0" y="866" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="middle">Contrato: o combinado entre front e servidor — o que eu peço, e o que recebo.</text><text x="960.0" y="950" font-family="Inter, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Se um lado muda o combinado, o outro quebra.</text><text x="110" y="1038" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#666666">guifav.github.io   ·   guilhermefavaron.com.br   ·   youtube: ia-aplicada</text></svg>