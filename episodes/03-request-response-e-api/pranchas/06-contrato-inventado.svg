" letter-spacing="-1.4">Quando a IA inventa o contrato</text><rect x="180" y="370" width="560" height="340" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><text x="460.0" y="414" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#A0A0A0" text-anchor="middle" letter-spacing="2.4">O QUE A IA ESCREVEU</text><text x="250" y="498" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#A0A0A0" text-anchor="start">o front espera receber:</text><text x="250" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="start">"título": ...</text><text x="250" y="602" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="start">"descrição": ...</text><text x="250" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#666666" text-anchor="start">campos que ninguém confirmou</text><rect x="1180" y="370" width="560" height="340" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><text x="1460.0" y="414" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#A0A0A0" text-anchor="middle" letter-spacing="2.4">O QUE O SERVIDOR DEVOLVE</text><text x="1250" y="498" font-family="Inter, DejaVu Sans, sans-serif" font-size="25" font-weight="400" fill="#A0A0A0" text-anchor="start">o contrato real:</text><text x="1250" y="555" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="start">"nome": "Produto A"</text><text x="1250" y="602" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF" text-anchor="start">"preco": 29.90</text><text x="1250" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#666666" text-anchor="start">nada de título ou descrição</text><circle cx="960" cy="530" r="250" fill="url(#g1)"/><line x1="760" y1="520" x2="900" y2="508" stroke="#666666" stroke-width="2"/><line x1="1160" y1="520" x2="1020" y2="508" stroke="#666666" stroke-width="2"/><line x1="926" y1="466" x2="994" y2="534" stroke="#F87171" stroke-width="5"/><line x1="926" y1="534" x2="994" y2="466" stroke="#F87171" stroke-width="5"/><text x="960" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#F87171" text-anchor="middle" letter-spacing="2.6">NÃO BATE</text><text x="960.0" y="812" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#FFBE00" text-anchor="middle" letter-spacing="2.9">A IA CHUTOU OS CAMPOS</text><text x="960.0" y="866" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="middle">O código roda sem acusar erro — e a tela fica vazia.</text><text x="960.0" y="950" font-family="Inter, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Pergunte: “você viu o contrato real, ou está chutando os campos?”</text><text x="110" y="1038" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#666666">guifav.github.io   ·   guilhermefavaron.com.br   ·   youtube: ia-aplicada</text></svg>