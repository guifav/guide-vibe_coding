tter-spacing="-1.4">Conflito: o git não decide sozinho</text><circle cx="590" cy="590" r="320" fill="url(#g1)"/><rect x="150" y="330" width="880" height="520" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><text x="590" y="384" font-family="Inter, DejaVu Sans, sans-serif" font-size="19" font-weight="600" fill="#A0A0A0" text-anchor="middle" letter-spacing="2.3">UM ARQUIVO · DUAS MUDANÇAS NO MESMO LUGAR</text><text x="220" y="452" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="start">função de login:</text><text x="220" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#F87171" text-anchor="start">&lt;&lt;&lt;&lt;&lt;&lt;&lt; sua versão</text><text x="220" y="556" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" text-anchor="start">botão azul, texto “Entrar”</text><text x="220" y="608" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#F87171" text-anchor="start">=======</text><text x="220" y="660" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" text-anchor="start">botão verde, texto “Acessar”</text><text x="220" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#F87171" text-anchor="start">&gt;&gt;&gt;&gt;&gt;&gt;&gt; versão do colega</text><text x="220" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#666666" text-anchor="start" font-style="italic">o git parou aqui e marcou o arquivo</text><text x="1120" y="420" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" font-weight="600" fill="#FFBE00" text-anchor="start" letter-spacing="2.6">RESOLVER É MANUAL</text><path d="M1129 502 L1141.8 513.2 L1161 492.4" fill="none" stroke="#34D399" stroke-width="4"/><text x="1192" y="512" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="start">abrir, ler as duas versões,</text><text x="1192" y="550" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="start">decidir e apagar as marcas</text><line x1="1129" y1="630" x2="1161" y2="662" stroke="#F87171" stroke-width="4"/><line x1="1129" y1="662" x2="1161" y2="630" stroke="#F87171" stroke-width="4"/><text x="1192" y="656" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="start">aceitar “resolvido” da IA</text><text x="1192" y="694" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="start">sem olhar o arquivo</text><text x="1120" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#666666" text-anchor="start" font-style="italic">Conflito mal resolvido é bug silencioso.</text><text x="960.0" y="950" font-family="Inter, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Conflito bem resolvido é coisa de humano.</text><text x="110" y="1038" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#666666">guifav.github.io   ·   guilhermefavaron.com.br   ·   youtube: ia-aplicada</text></svg>