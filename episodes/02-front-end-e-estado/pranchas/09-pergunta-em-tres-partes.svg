ter-spacing="-1.4">Quando quebra, pergunte em três partes</text><circle cx="960.0" cy="585" r="340" fill="url(#g1)"/><line x1="460" y1="425.0" x2="460" y2="755.0" stroke="#FFBE00" stroke-width="3"/><rect x="380" y="360" width="1160" height="130" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><circle cx="460" cy="425.0" r="30" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/><text x="460" y="435.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="540" y="420" font-family="Inter, DejaVu Sans, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">O evento está disparando?</text><text x="540" y="460" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#A0A0A0" text-anchor="start">se não, o clique não está chegando ao código</text><rect x="380" y="525" width="1160" height="130" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><circle cx="460" cy="590.0" r="30" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/><text x="460" y="600.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="540" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">O estado está mudando?</text><text x="540" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#A0A0A0" text-anchor="start">se não, o problema é a lógica que trata o evento</text><rect x="380" y="690" width="1160" height="130" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><circle cx="460" cy="755.0" r="30" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="2"/><text x="460" y="765.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="540" y="750" font-family="Inter, DejaVu Sans, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">A tela está re-renderizando?</text><text x="540" y="790" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#A0A0A0" text-anchor="start">se não, o problema é a ligação entre estado e tela</text><text x="960.0" y="880" font-family="Inter, DejaVu Sans, sans-serif" font-size="28" font-weight="400" fill="#A0A0A0" text-anchor="middle">Cole as três perguntas na conversa com a IA: a resposta isola o problema.</text><text x="960.0" y="950" font-family="Inter, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Três perguntas, três suspeitos. Um deles é o culpado.</text><text x="110" y="1038" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#666666">guifav.github.io   ·   guilhermefavaron.com.br   ·   youtube: ia-aplicada</text></svg>