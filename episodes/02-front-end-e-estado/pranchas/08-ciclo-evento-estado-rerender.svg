ter-spacing="-1.4">O ciclo: evento, estado, re-render</text><circle cx="870.0" cy="540.0" r="280" fill="url(#g1)"/><rect x="120" y="420" width="440" height="240" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><text x="340.0" y="482" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#A0A0A0" text-anchor="middle" letter-spacing="2.9">EVENTO</text><text x="340.0" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="middle">você interage;</text><text x="340.0" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="middle">o navegador avisa</text><line x1="568" y1="540.0" x2="642" y2="540.0" stroke="#FFFFFF" stroke-width="3"/><path d="M642 540.0 L629.4 546.1 L629.4 533.9 Z" fill="#FFFFFF"/><rect x="650" y="420" width="440" height="240" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><text x="870.0" y="482" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#FFBE00" text-anchor="middle" letter-spacing="2.9">ESTADO</text><text x="870.0" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="middle">o valor muda na</text><text x="870.0" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="middle">variável, hook ou store</text><line x1="1098" y1="540.0" x2="1172" y2="540.0" stroke="#FFFFFF" stroke-width="3"/><path d="M1172 540.0 L1159.4 546.1 L1159.4 533.9 Z" fill="#FFFFFF"/><rect x="1180" y="420" width="440" height="240" rx="16" fill="#0D0D0D" stroke="#2A2A2A" stroke-width="2"/><text x="1400.0" y="482" font-family="Inter, DejaVu Sans, sans-serif" font-size="24" font-weight="600" fill="#A0A0A0" text-anchor="middle" letter-spacing="2.9">RE-RENDER</text><text x="1400.0" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="middle">o DOM atualiza; a tela</text><text x="1400.0" y="590" font-family="Inter, DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="middle">repinta o que mudou</text><line x1="1400.0" y1="660" x2="1400.0" y2="760" stroke="#666666" stroke-width="2"/><line x1="1400.0" y1="760" x2="340.0" y2="760" stroke="#666666" stroke-width="2"/><line x1="340.0" y1="760" x2="340.0" y2="668" stroke="#666666" stroke-width="2"/><path d="M340.0 668 L346.1 680.6 L333.9 680.6 Z" fill="#666666"/><text x="960.0" y="800" font-family="Inter, DejaVu Sans, sans-serif" font-size="20" font-weight="600" fill="#A0A0A0" text-anchor="middle" letter-spacing="2.4">PRÓXIMA INTERAÇÃO: O CICLO REPETE</text><text x="960.0" y="870" font-family="Inter, DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#A0A0A0" text-anchor="middle">Quem liga o estado ao DOM é o código, seu ou do framework. O navegador só repinta.</text><text x="960.0" y="950" font-family="Inter, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#FFFFFF" text-anchor="middle" font-style="italic">Reatividade é isso: a tela se atualiza sozinha quando o estado muda.</text><text x="110" y="1038" font-family="Inter, DejaVu Sans, sans-serif" font-size="21" fill="#666666">guifav.github.io   ·   guilhermefavaron.com.br   ·   youtube: ia-aplicada</text></svg>